name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    name: Ensure no secrets are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # scripts/check-secrets.mjs uses only Node built-ins, so no install step
      # is needed. It fails the job if a JWT, sb_secret_..., or GOCSPX-... value
      # is found in a tracked file, or if a real .env is not gitignored.
      - name: Scan tracked files for secrets
        run: node scripts/check-secrets.mjs
